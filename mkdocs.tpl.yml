site_name: CELINE Project
site_url: https://celine-eu.github.io

theme:
  name: material
  # No Google Fonts: each visitor's browser would otherwise fetch them from Google.
  # The theme falls back to the system font stack.
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy

plugins:
  - search

nav:
  - Home: index.md
  - Tools: projects/
  - Pipelines Tutorial: projects/celine-utils/docs/pipeline-tutorial
  - Ontology: ontologies/
  - Governance schemas: schema/

docs_dir: site
site_dir: docs
