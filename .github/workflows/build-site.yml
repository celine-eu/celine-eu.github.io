name: Build CELINE website

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [celine-docs-update]
  workflow_dispatch:

permissions:
  contents: write

# Runs push generated docs to main; serialize them so pushes don't race.
concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"

      - name: Install Task
        uses: arduino/setup-task@v2

      - name: Build site
        run: task ci

      - name: Commit generated docs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if git status --porcelain docs | grep .; then
            git add docs
            git commit -m "chore(docs): rebuild site"
            # main may have moved during the build (manual push, other dispatch)
            for i in 1 2 3; do
              if git pull --rebase --autostash -X theirs && git push; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            exit 1
          else
            echo "No changes in docs/, skipping commit"
          fi
