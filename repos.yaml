      - Pipelines Reference: docs/pipelines-reference.md
      - Local Runtime: docs/local-runtime.md
      - Testing: docs/testing.md
      - Development: docs/development.md
      # Per-pipeline references. These are apps/<name>/README.md, which the
      # builder renames to index.md. An app with no README cannot be listed
      # here — `overture` and `trentino_rooftops` are the two still missing one.
      - Open Meteo: apps/om/index.md
      - MeteoTrentino: apps/mt/index.md
      - Open Weather Map: apps/owm/index.md
      - Copernicus: apps/copernicus/index.md
      - DWD ICON: apps/dwd/index.md
      - Weather Facade: apps/weather/index.md
      - Open Street Map: apps/osm/index.md
      - PV Estimation: apps/pv_estimation/index.md
      - PV Detection: apps/pv_detection/index.md
      - Grid Resilience: apps/grid/index.md
      - REC Metering: apps/rec_metering/index.md
      - REC Italy: apps/rec_it/index.md
      - REC Flexibility: apps/rec_flexibility/index.md
      - CELINE REC registry: apps/rec_registry/index.md
      - CELINE Flexibility Commitments: apps/rec_flexibility_commitments/index.md

  - name: Ontologies
    slug: celine-ontologies
    git: https://github.com/celine-eu/ontologies.git

    paths:
      - README.md
      - specs/**
      - releases/**

    nav:
      - README

    links:
      # One directory per ontology version, each holding both artifact trees:
      # releases/ (WIDOCO documentation and serializations) and specs/ (celine.*).
      # The two share no filenames, which is what makes merging them safe, and it
      # is what lets https://w3id.org/celine-eu/v0.10/<anything> resolve under a
      # path that does not encode this site's projects/<slug> layout.
      #
      # Order is load-bearing: a replacing copy removes its target first, so the
      # two replacing entries must come before the two merging ones.
      - name: ontology (current release)
        source: projects/celine-ontologies/releases/current
        target: ontologies
      - name: ontology (current specs)
        source: projects/celine-ontologies/specs/current
        target: ontologies
        merge: true
      - name: ontology (released versions)
        source: projects/celine-ontologies/releases/v*
        target: ontologies
        glob: true
      - name: ontology (versioned specs)
        source: projects/celine-ontologies/specs/v*
        target: ontologies
        glob: true
        merge: true

